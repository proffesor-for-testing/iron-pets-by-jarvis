version: "3.6.4"

project:
  name: "iron-pets-by-jarvis"
  root: "/home/user/iron-pets-by-jarvis"
  type: "single"

learning:
  enabled: true
  embeddingModel: "transformer"
  hnswConfig:
    M: 16
    efConstruction: 200
    efSearch: 100
  qualityThreshold: 0.7
  promotionThreshold: 3
  pretrainedPatterns: true

routing:
  mode: "hybrid"
  confidenceThreshold: 0.7
  feedbackEnabled: true

workers:
  enabled:
    - "pattern-consolidator"
    - "routing-accuracy-monitor"
    - "coverage-gap-scanner"
  intervals:
    pattern-consolidator: 1800000
    coverage-gap-scanner: 3600000
    flaky-test-detector: 7200000
    routing-accuracy-monitor: 900000
  maxConcurrent: 4
  daemonAutoStart: true

hooks:
  claudeCode: true
  preCommit: false
  ciIntegration: false

skills:
  install: true
  installV2: true
  installV3: true
  overwrite: false

domains:
  enabled:
    - "test-generation"
    - "test-execution"
    - "coverage-analysis"
    - "quality-assessment"
    - "defect-intelligence"
    - "requirements-validation"
    - "code-intelligence"
    - "security-compliance"
    - "contract-testing"
    - "visual-accessibility"
    - "chaos-resilience"
    - "learning-optimization"
  disabled:

agents:
  maxConcurrent: 8
  defaultTimeout: 60000
