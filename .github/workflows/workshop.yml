name: Workshop baseline
on:
  pull_request:
  push:
    branches: [main, workshop/sixsentix-participants, workshop/sixsentix-instructor]
permissions:
  contents: read
jobs:
  workshop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reviewed dependencies
        run: npm run workshop:setup
      - name: Component, HTTP contract and legacy tests
        run: npm run workshop:check
      - name: Reversible mutation and hook handler
        run: npm run workshop:rehearse
      - name: Cart exercise and repeatable reset (no database)
        run: npm run workshop:accept
      - name: Full reference contracts (baseline or instructor only)
        if: github.ref != 'refs/heads/workshop/sixsentix-participants'
        run: npm --prefix src/iron-pets/backend run test:contracts
